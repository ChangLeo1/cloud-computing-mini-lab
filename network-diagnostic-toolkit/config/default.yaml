targets:
  internet_ip: "1.1.1.1"
  dns_hostname: "cloudflare.com"
  tcp_targets:
    - host: "cloudflare.com"
      port: 443
thresholds:
  gateway_latency_ms: {good: 5, warning: 20}
  internet_latency_ms: {good: 50, warning: 100}
  packet_loss_pct: {good: 1, warning: 5}
  dns_response_ms: {good: 100, warning: 300}
execution:
  ping_count: 10
  ping_timeout_ms: 1000
  tcp_timeout_seconds: 3
  traceroute_max_hops: 20
  traceroute_timeout_ms: 1000
privacy:
  retention_days: 30
