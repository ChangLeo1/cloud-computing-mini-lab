name: Data Lakehouse CI

on:
  push:
    paths:
      - "data-engineering-lakehouse/**"
      - ".github/workflows/data-lakehouse-test.yml"
  pull_request:
    paths:
      - "data-engineering-lakehouse/**"
      - ".github/workflows/data-lakehouse-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering-lakehouse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-engineering-lakehouse/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest -q
