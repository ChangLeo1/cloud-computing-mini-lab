name: Network Diagnostic Toolkit Tests
on:
  push:
    paths:
      - 'network-diagnostic-toolkit/**'
      - '.github/workflows/network-diagnostic-toolkit-tests.yml'
  pull_request:
    paths:
      - 'network-diagnostic-toolkit/**'
      - '.github/workflows/network-diagnostic-toolkit-tests.yml'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: network-diagnostic-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Unit tests
        run: pytest --cov=netdiag --cov-report=term-missing
